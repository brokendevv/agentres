<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // 1. Prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        // when browser extensions or iframe shims attempt to overwrite window.fetch.
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (winDesc && winDesc.get && !winDesc.set && winDesc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch || winDesc.get.call(window);
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
          var protoDesc =
            typeof Window !== 'undefined' && Window.prototype
              ? Object.getOwnPropertyDescriptor(Window.prototype, 'fetch')
              : null;
          if (protoDesc && protoDesc.get && !protoDesc.set && protoDesc.configurable !== false) {
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch || protoDesc.get.call(this);
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (e) {}

        // 2. Suppress uncaught errors injected by third-party browser extensions (chrome-extension://)
        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              file.indexOf('chrome-extension://') === 0 ||
              file.indexOf('moz-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        // 3. Synchronous dark/light theme initialization to prevent flash
        try {
          var saved = localStorage.getItem('tablepulse_theme');
          var sysDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && sysDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
